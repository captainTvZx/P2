[package]
name = "p2-media"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
p2-i18n = { path = "../p2-i18n" }
cpal = "0.16"
futures = "0.3.34"
libwebrtc = "0.4.0"
windows = { version = "0.62", features = ["Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_Media_Audio", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.62"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "time", "sync", "macros"] }
