[package]
name = "p2-server-ops"
description = "P2 Server işletimi: server.json, günlük, göç, başlat/durdur, Windows hizmeti, yedekleme"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
chrono = "0.4.45"
flate2 = "1.1"
getrandom = "0.3"
hex = "0.4.3"
hmac = "0.13.0"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
# p2-server ile aynı sürüm; TLS: `sslmode=require` bağlantıları (Electron sürümü `ssl: { rejectUnauthorized: false }`).
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "chrono", "json"] }
tar = "0.4"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "time", "macros"] }
url = "2.5"
