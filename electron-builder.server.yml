appId: com.p2.server
productName: P2 Server
extraMetadata:
  main: electron/server-main.cjs
electronDist: node_modules/electron/dist
directories:
  output: release-package/server
files:
  - server/dist/**/*
  - server/prisma/**/*
  - server/package.json
  - server/ops/**/*
  - electron/server-main.cjs
  - electron/server-preload.cjs
  - electron/server-console.html
  - electron/server-console.css
  - electron/p2-mavi.cjs
  - electron/server-updater.cjs
  - electron/service/*.bat
  - package.json
extraResources:
  - from: node_modules/.prisma
    to: node_modules/.prisma
  - from: node_modules/@prisma/client
    to: node_modules/@prisma/client
  - from: build/icon-server.png
    to: icon-server.png
extraFiles:
  - from: electron/service
    to: .
    filter:
      - "*.bat"
      - "*.ps1"
  - from: .server-service
    to: .
    filter:
      - "P2ServerService.exe"
      - "P2ServerService.xml"
win:
  icon: build/icon-server.png
  target: nsis
  artifactName: P2-Server-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  allowElevation: true
  runAfterFinish: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: P2 Server
  deleteAppDataOnUninstall: false
publish:
  - provider: generic
    url: http://127.0.0.1:4000/updates/server/
    channel: latest
