[package]
name = "p2-server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
argon2 = "0.6.0"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
p2-server-ops = { path = "../../crates/p2-server-ops" }
fancy-regex = "0.20.2"
hex = "0.4.3"
hmac = "0.13.0"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["rust_crypto"] }
rand = "0.10.3"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha1 = "0.11.0"
sha2 = "0.11.1"
socketioxide = { version = "0.18.9", features = ["state", "extensions"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "chrono", "uuid", "json", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.2", features = ["v4"] }

[build-dependencies]
embed-resource = "3.0"
image = { version = "0.25", default-features = false, features = ["png"] }
