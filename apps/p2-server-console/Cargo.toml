[package]
name = "p2-server-console"
description = "P2 Server Console: veritabanı ayarı, başlat/durdur, Windows hizmeti, yedek, güncelleme"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
p2-ui.workspace = true
p2-server-ops = { path = "../../crates/p2-server-ops" }
p2-updater = { path = "../../crates/p2-updater" }
image = { version = "0.25", default-features = false, features = ["png"] }
regex = "1.13.1"
serde_json = "1.0.154"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "3.0"
image = { version = "0.25", default-features = false, features = ["png"] }
